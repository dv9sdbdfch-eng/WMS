# Builds the Windows installer on GitHub's Windows machines.
#  - every push to main: installer is attached to the run (Actions tab -> run -> Artifacts)
#  - pushing a tag like v1.0.1: installer is also published on the Releases page
name: Build Windows installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Test and build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: StoreWMS-installer
          path: dist/StoreWMS-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StoreWMS-Setup-*.exe
          generate_release_notes: true
