[project]
name = "store-wms"
version = "1.0.1"
description = "Warehouse management for furniture manufacturing (Windows desktop)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905", "E501", "E741", "UP037", "UP042"]

[tool.ruff.lint.per-file-ignores]
"wms/db/migrations/*" = ["E501", "I001", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
